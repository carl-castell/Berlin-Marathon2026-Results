[project]
name = "marathon"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "marimo>=0.25.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "rich>=15.0.0",
    "scrapy>=2.19.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "country-converter>=1.3.2",
    "pycountry>=26.2.16",
]

[tool.marimo.runtime]
# editing notebooks/marathon_data.py marks dependent cells stale in open notebooks
auto_reload = "lazy"
